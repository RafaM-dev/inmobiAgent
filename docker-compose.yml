services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentinmobi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentinmobi
      POSTGRES_PASSWORD: agentinmobi
      POSTGRES_DB: agentinmobi
    ports:
      # 5433 en el host: 5432 suele estar ocupado por otro Postgres local.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Sin bind mounts a propósito: dependen de qué unidades comparta Docker
    # Desktop en cada máquina. Las extensiones (vector, pg_trgm, unaccent) se
    # crean en la primera migración de Prisma, que es reproducible en cualquier
    # entorno, incluido producción.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentinmobi -d agentinmobi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura de correo en desarrollo: notificaciones a asesores sin enviar nada real.
  mailpit:
    image: axllent/mailpit:latest
    container_name: agentinmobi-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

volumes:
  postgres-data:
